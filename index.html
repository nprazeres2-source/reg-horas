<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registo de Horas de Trabalho</title>
<meta name="theme-color" content="#0f6e6e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Horas">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style id="css">
:root{--bg:#f4f5f7;--card:#fff;--ink:#1b1f24;--mut:#6b7280;--line:#e3e6ea;--acc:#0f6e6e;--acc2:#e6f2f2;--ok:#1a7f37;--okb:#e7f5ea;--warn:#b45309;--warnb:#fdf3e2;--bad:#b42318;--badb:#fdeceb}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--card:#1b1e23;--ink:#e8eaed;--mut:#9aa1ab;--line:#2c3037;--acc:#4fb3b3;--acc2:#1d2b2c;--ok:#5cc27a;--okb:#16261b;--warn:#e9a54b;--warnb:#2b2214;--bad:#f07a6f;--badb:#2e1816}}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-text-size-adjust:100%}
header{background:var(--acc);color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:5}
@media (prefers-color-scheme:dark){header{color:#0d1a1a}}
header h1{margin:0 0 10px;font-size:18px;font-weight:650}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav button{flex:0 0 auto;background:none;border:0;color:inherit;opacity:.75;padding:9px 12px;font-size:14px;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{opacity:1;border-bottom-color:currentColor;font-weight:600}
main{max-width:860px;margin:0 auto;padding:14px 12px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;font-weight:650}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.grid.g4{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .l{font-size:12px;color:var(--mut)}.kpi .v{font-size:20px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}.kpi .s{font-size:12px;color:var(--mut);margin-top:2px}
.kpi.bad .v{color:var(--bad)}.kpi.ok .v{color:var(--ok)}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:56px}
.row{display:grid;gap:10px;margin-bottom:10px}.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:1fr 1fr 1fr}
.btn{border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){.btn{color:#0d1a1a}}
.btn.sec{background:var(--acc2);color:var(--acc)}.btn.del{background:var(--badb);color:var(--bad)}.btn.sm{padding:6px 10px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.fab{position:fixed;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;font-size:28px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6}
.list .it{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.it .t{font-weight:600}.it .d{font-size:12.5px;color:var(--mut);margin-top:2px}.it .a{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px}
.tag.ok{background:var(--okb);color:var(--ok)}.tag.warn{background:var(--warnb);color:var(--warn)}.tag.bad{background:var(--badb);color:var(--bad)}.tag.mut{background:var(--bg);color:var(--mut)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13.5px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--mut);font-weight:600}
.scroll{overflow-x:auto}
.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--acc)}
.muted{color:var(--mut);font-size:13px}.empty{color:var(--mut);text-align:center;padding:18px 0}
.filters{display:flex;gap:8px;margin-bottom:10px}.filters>*{flex:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:640px){.modal{align-items:center}.sheet{border-radius:16px}}
.sheet h3{margin:0 0 12px;font-size:17px}
.calc{background:var(--acc2);color:var(--acc);border-radius:8px;padding:10px;font-weight:600;margin-bottom:10px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
.pbtn{margin-top:5px;border:1px solid var(--line);background:var(--card);color:var(--acc);border-radius:20px;padding:3px 10px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px}
.adr{display:grid;grid-template-columns:1fr 88px 36px;gap:6px;margin-bottom:6px}.ad-x{border:0;border-radius:8px;background:var(--badb);color:var(--bad);font-size:18px;cursor:pointer}
.lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:#0f6e6e;color:#fff;text-align:center}
.lock h2{margin:6px 0 4px;font-size:20px}.lock p{margin:0;opacity:.9;min-height:20px}.lk-ic{font-size:38px}
.dots{display:flex;gap:12px;margin:16px 0 24px;min-height:16px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff}.dots i.f{background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}.pad button{width:72px;height:72px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:26px;cursor:pointer}.pad button:active{background:rgba(255,255,255,.35)}
.lnk{background:none;border:0;color:#fff;opacity:.85;margin-top:22px;text-decoration:underline;font:inherit;cursor:pointer}
.shake{animation:sh .35s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.hlock{float:right;background:rgba(255,255,255,.2);border:0;border-radius:8px;color:inherit;margin-left:8px;padding:2px 8px;font-size:14px;cursor:pointer}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink);margin:10px 0 0}.chk input{width:auto}
.warnc{background:var(--warnb);border-color:transparent;color:var(--warn)}.warnc .btn{background:var(--warn);color:#fff}
.sync{font-size:11.5px;opacity:.85;float:right;margin-top:3px}
</style>
</head>
<body>
<div id="app"></div>
<script id="data" type="application/json">{"v":1,"updatedAt":0,"ents":[],"regs":[],"pags":[],"cfg":{"diasSemana":[1,2,3,4,5]}}</script>
<script id="code">
(function(){
const SRC_CSS=document.getElementById('css').textContent;
const SRC_CODE=document.getElementById('code').textContent;
const TITLE=document.title;
const EMPTY=()=>({v:1,updatedAt:0,ents:[],regs:[],pags:[],cfg:{diasSemana:[1,2,3,4,5]}});
let S=null,KEY=null,SALT=null,PINLEN=0;
const LK='registo-horas-trabalho-v1';
function norm(d){d=d&&typeof d==='object'?d:EMPTY();d.ents=d.ents||[];d.regs=d.regs||[];d.pags=d.pags||[];d.cfg=d.cfg||{};if(!d.cfg.diasSemana)d.cfg.diasSemana=[1,2,3,4,5];
  d.regs.forEach(r=>{if(!r.adics)r.adics=[];if(+r.extra){r.adics.push({id:'ad'+Math.random().toString(36).slice(2,9),desc:'Extra',valor:+r.extra})}r.extra=0});return d}
let RAW=null;try{RAW=JSON.parse(localStorage.getItem(LK)||'null')}catch(e){}
const START_LOCKED=!!(RAW&&RAW.enc);
if(!START_LOCKED){let E0=null;try{E0=JSON.parse(document.getElementById('data').textContent)}catch(e){}S=norm(RAW&&(!E0||(RAW.updatedAt||0)>=(E0.updatedAt||0))?RAW:E0)}

// Encriptação (PBKDF2 + AES-GCM)
const b64=u=>{const a=new Uint8Array(u);let s='';for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const newSalt=()=>b64(crypto.getRandomValues(new Uint8Array(16)));
async function deriveKey(pin,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:ub64(salt),iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encObj(obj,key,salt,len){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));return {enc:1,app:'registo-horas',len,salt,iv:b64(iv),ct:b64(ct)}}
async function decObj(w,key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(w.iv)},key,ub64(w.ct));return JSON.parse(new TextDecoder().decode(pt))}

let ART=null,pubTimer=null,syncState='local';
(async()=>{try{if(window.claude&&claude.use){ART=await claude.use('artifact');setSync(ART?'guardado':'local')}}catch(e){}})();
let DL=null;(async()=>{try{if(window.claude&&claude.use)DL=await claude.use('downloads')}catch(e){}})();

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>(Math.round((n||0)*100)/100).toLocaleString('pt-PT',{style:'currency',currency:'EUR'});
const hh=n=>{n=n||0;const h=Math.floor(n+1e-9),m=Math.round((n-h)*60);return h+'h'+(m?String(m).padStart(2,'0'):'')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mLabel=k=>{const [y,m]=k.split('-');return MESES[+m-1]+' '+y};
const mShort=k=>{const [y,m]=k.split('-');return MESES[+m-1].slice(0,3)+' '+y.slice(2)};
const fdate=s=>{if(!s)return'';const [y,m,d]=s.split('-');return d+'/'+m+'/'+y};
const DOW=['dom','seg','ter','qua','qui','sex','sáb'];
const dow=s=>DOW[new Date(s+'T12:00').getDay()];
const ent=id=>S.ents.find(e=>e.id===id)||{nome:'(sem entidade)',valor:0,prazoTipo:'dia',prazo:8};
const toMin=t=>{if(!t)return null;const [h,m]=t.split(':');return +h*60+ +m};

function regHoras(r){
  if(r.modo==='horas')return +r.horas||0;
  const a=toMin(r.ini),b=toMin(r.fim);if(a==null||b==null)return 0;
  let d=b-a;if(d<=0)d+=1440;d-=(+r.pausa||0);return Math.max(0,d/60);
}
const adicsOf=r=>(r.adics||[]);
const regBase=r=>Math.round(regHoras(r)*(+r.valor||0)*100)/100;
const adicTot=r=>adicsOf(r).reduce((s,a)=>s+(+a.valor||0),0)+(+r.extra||0);
const regValor=r=>Math.round((regBase(r)+adicTot(r))*100)/100;

function prazoDe(entId,mk){
  const e=ent(entId);const [y,m]=mk.split('-').map(Number);
  if(e.prazoTipo==='dias'){const d=new Date(y,m,0);d.setDate(d.getDate()+(+e.prazo||0));return iso(d)}
  const last=new Date(y,m+1,0).getDate();const dia=Math.min(+e.prazo||1,last);return iso(new Date(y,m,dia));
}

function regPagoLig(r){return S.pags.filter(p=>p.reg===r.id).reduce((a,p)=>a+(+p.valor||0),0)}
let CALC=null;
const pagosDe=f=>S.pags.filter(f).reduce((a,p)=>a+(+p.valor||0),0);
const pagoHoras=r=>pagosDe(p=>p.reg===r.id&&!p.adic);
const pagoAdic=(r,a)=>pagosDe(p=>p.reg===r.id&&p.adic===a.id);
function parteEst(v,pg,mp){if(mp||pg>=v-0.004)return {e:'pago',pago:v,falta:0};return {e:pg>0?'parcial':'pendente',pago:pg,falta:Math.round((v-pg)*100)/100}}
function mesPago(r){const row=CALC&&CALC.rows.find(x=>x.ent===r.ent&&x.mes===r.data.slice(0,7));return !!(row&&row.estado==='pago')}
function regEstado(r){return parteEst(regValor(r),regPagoLig(r),mesPago(r))}
// Cálculo por mês e entidade com alocação dos pagamentos
function calc(){
  const map={};
  const key=(e,m)=>e+'|'+m;
  S.regs.forEach(r=>{const mk=r.data.slice(0,7),k=key(r.ent,mk);
    if(!map[k])map[k]={ent:r.ent,mes:mk,horas:0,valor:0,dias:new Set(),pago:0};
    map[k].horas+=regHoras(r);map[k].valor+=regValor(r);map[k].dias.add(r.data)});
  const rows=Object.values(map);rows.forEach(r=>{r.valor=Math.round(r.valor*100)/100;r.prazo=prazoDe(r.ent,r.mes)});
  let credito={};
  const byEnt=e=>rows.filter(r=>r.ent===e).sort((a,b)=>a.mes.localeCompare(b.mes));
  const pags=[...S.pags].sort((a,b)=>a.data.localeCompare(b.data));
  pags.forEach(p=>{let rest=+p.valor||0;
    if(p.mes){const r=rows.find(x=>x.ent===p.ent&&x.mes===p.mes);if(r){const t=Math.min(rest,Math.max(0,r.valor-r.pago));r.pago+=t;rest-=t;if(t>0)(r.ultPag=p.data)}}
    if(rest>0.004){for(const r of byEnt(p.ent)){const t=Math.min(rest,Math.max(0,r.valor-r.pago));if(t>0){r.pago+=t;rest-=t;r.ultPag=p.data}if(rest<=0.004)break}}
    if(rest>0.004)credito[p.ent]=(credito[p.ent]||0)+rest});
  const hoje=today();
  rows.forEach(r=>{r.pago=Math.round(r.pago*100)/100;r.falta=Math.max(0,Math.round((r.valor-r.pago)*100)/100);
    r.estado=r.falta<=0.004?'pago':(r.prazo<hoje?'atraso':(r.pago>0?'parcial':'pendente'));
    r.diasN=r.dias.size});
  return {rows,credito};
}

function diasUteis(mk,ateDia){
  const [y,m]=mk.split('-').map(Number);const last=new Date(y,m,0).getDate();let n=0;
  for(let d=1;d<=(ateDia==null?last:ateDia);d++){if(S.cfg.diasSemana.includes(new Date(y,m-1,d).getDay()))n++}return n;
}
function estimativa(){
  const now=new Date(),mk=iso(now).slice(0,7);
  const regsM=S.regs.filter(r=>r.data.startsWith(mk));
  const ganho=regsM.reduce((a,r)=>a+regValor(r),0),horas=regsM.reduce((a,r)=>a+regHoras(r),0);
  const tot=diasUteis(mk),dec=diasUteis(mk,now.getDate());
  const proj=dec>0?ganho/dec*tot:ganho,projH=dec>0?horas/dec*tot:horas;
  // média dos últimos 3 meses completos
  const meses=[];for(let i=1;i<=3;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);meses.push(iso(d).slice(0,7))}
  const tots=meses.map(k=>S.regs.filter(r=>r.data.startsWith(k)).reduce((a,r)=>a+regValor(r),0)).filter(v=>v>0);
  const media=tots.length?tots.reduce((a,b)=>a+b,0)/tots.length:0;
  return {mk,ganho,horas,proj:Math.max(proj,ganho),projH:Math.max(projH,horas),tot,dec,media,nMed:tots.length};
}

// Persistência
let saveChain=Promise.resolve();
function persist(){const snap=JSON.parse(JSON.stringify(S)),k=KEY,sa=SALT,ln=PINLEN;
  saveChain=saveChain.then(async()=>{try{if(k)localStorage.setItem(LK,JSON.stringify(await encObj(snap,k,sa,ln)));else localStorage.setItem(LK,JSON.stringify(snap))}catch(e){toast('Erro ao guardar')}});return saveChain}
function save(msg){
  S.updatedAt=Date.now();
  persist();
  if(msg)toast(msg);
  render();
  if(ART){setSync('a guardar…');clearTimeout(pubTimer);pubTimer=setTimeout(publish,1500)}
}
function buildDoc(){
  const data=JSON.stringify(S).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="pt">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>'+esc(TITLE)+'</title>\n<style id="css">'+SRC_CSS+'</style>\n</head>\n<body>\n<div id="app"></div>\n<script id="data" type="application/json">'+data+'<\/script>\n<script id="code">'+SRC_CODE+'<\/script>\n</body>\n</html>\n';
}
async function publish(){
  if(!ART)return;
  try{await ART.publish(buildDoc());setSync('guardado')}
  catch(e){const c=(e&&(e.code||e.name||e.message))||'';
    if(/conflict/i.test(c)){setSync('atualizado noutro dispositivo')}
    else if(/not_granted|not_writer/i.test(c)){setSync('só leitura (guardado neste dispositivo)')}
    else{setSync('erro ao guardar — dados guardados neste dispositivo')}}
}
function setSync(t){syncState=t;const el=$('#sync');if(el)el.textContent=t==='local'?'guardado neste dispositivo':t}

let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),1800)}

// UI
let TAB='resumo',FM=iso(new Date()).slice(0,7),FE='';
function shell(){
  document.getElementById('app').innerHTML=`
  <header><h1>Registo de Horas ${KEY?'<button class="hlock" id="lockb" aria-label="Bloquear">🔒</button>':''}<span class="sync" id="sync"></span></h1>
  <nav>${[['resumo','Resumo'],['registos','Dias & horas'],['pagamentos','Pagamentos'],['meses','Por mês'],['config','Definições']].map(([k,l])=>`<button data-tab="${k}">${l}</button>`).join('')}</nav></header>
  <main id="main"></main>
  <button class="btn fab" id="fab" aria-label="Adicionar">+</button>
  <div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
  <div class="toast" id="toast"></div>`;
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;render();window.scrollTo(0,0)});
  if($('#lockb'))$('#lockb').onclick=lockNow;
  $('#fab').onclick=()=>{if(!S.ents.length){TAB='config';render();openEnt();return}
    if(TAB==='pagamentos')openPag();else openReg()};
  $('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};
  setSync(syncState);
}
function render(){
  CALC=calc();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===TAB));
  $('#fab').style.display=TAB==='config'||TAB==='meses'?'none':'';
  const m=$('#main');
  if(!S.ents.length&&TAB!=='config'){m.innerHTML=`<div class="card"><h2>Bem-vindo</h2><p class="muted">Comece por criar a entidade para quem trabalha (empregador ou cliente), com o valor à hora e o prazo de pagamento.</p><button class="btn" id="go">Criar entidade</button></div>`;$('#go').onclick=()=>{TAB='config';render();openEnt()};return}
  ({resumo:vResumo,registos:vRegistos,pagamentos:vPags,meses:vMeses,config:vConfig})[TAB](m);
}
const estTag=s=>({pago:'<span class="tag ok">Pago</span>',parcial:'<span class="tag warn">Parcial</span>',pendente:'<span class="tag mut">Pendente</span>',atraso:'<span class="tag bad">Em atraso</span>'})[s];
const diasAte=d=>Math.round((new Date(d+'T12:00')-new Date(today()+'T12:00'))/864e5);

function vResumo(m){
  const {rows,credito}=calc(),E=estimativa();
  const falta=rows.reduce((a,r)=>a+r.falta,0),atraso=rows.filter(r=>r.estado==='atraso').reduce((a,r)=>a+r.falta,0);
  const totCred=Object.values(credito).reduce((a,b)=>a+b,0);
  const abertos=rows.filter(r=>r.falta>0).sort((a,b)=>a.prazo.localeCompare(b.prazo));
  const ano=new Date().getFullYear()+'';

function estimHTML(){

function openM(html){$('#sheet').innerHTML=html;$('#modal').classList.add('on')}

function openReg(r,asNew){

  <div class="row"><div><label>Notas</label><input id="rn" value="${esc(r.nota||'')}" placeholder="Local, observações…"></div></div>
  <div class="calc" id="rc"></div>
  ${isNew?'':(()=>{const st=regEstado(r);return `<div class="row"><div><label>Pagamento</label>${estTag(st.e)} ${st.e==='parcial'?'pago '+eur(st.pago)+' · falta '+eur(st.falta):''} <button class="pbtn" id="rqp">${st.e==='pago'?'Ver / alterar':'Indicar pagamento'}</button></div></div>`})()}
  <div class="btns"><button class="btn" id="rs">Guardar</button>${isNew?'<button class="btn sec" id="rs2">Guardar e outro</button>':'<button class="btn sec" id="rdup">Duplicar</button><button class="btn del" id="rdel">Apagar</button>'}<button class="btn sec" id="rcan">Cancelar</button></div>`);
  const cleanAds=()=>ads.filter(a=>String(a.desc||'').trim()||+a.valor).map(a=>({id:a.id,desc:String(a.desc||'').trim(),valor:+a.valor||0}));
  const get=()=>({...r,data:$('#rd').value,ent:$('#re')?$('#re').value:r.ent,modo:$('#rm').value,ini:$('#ri').value,fim:$('#rf').value,pausa:+$('#rp').value||0,horas:+$('#rh').value||0,valor:+$('#rv').value||0,adics:cleanAds(),extra:0,tarefa:$('#rt').value.trim(),nota:$('#rn').value.trim()});

  const renderAds=()=>{$('#adl').innerHTML=ads.map((a,i)=>`<div class="adr"><input class="ad-d" data-i="${i}" value="${esc(a.desc||'')}" placeholder="Descrição (ex.: limpeza extra)"><input class="ad-v" data-i="${i}" type="number" inputmode="decimal" step="0.01" value="${a.valor===''||a.valor==null?'':a.valor}" placeholder="€"><button type="button" class="ad-x" data-i="${i}" aria-label="Remover">×</button></div>`).join('');

async function download(fn,txt,type){

  try{const u=URL.createObjectURL(new Blob([txt],{type:bin?type:(type||'text/csv')+';charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Ficheiro transferido');return true}catch(e){}
  if(bin){toast('Não foi possível transferir');return}

}

  pg.drawRectangle({x:0,y:H-78,width:W,height:78,color:ACC});
  txt('Registo de horas de trabalho',M,H-38,{b:1,sz:17,c:rgb(1,1,1)});
  txt(perTxt.charAt(0).toUpperCase()+perTxt.slice(1),M,H-58,{sz:11,c:rgb(.9,.97,.97)});
  txt('Emitido em '+fdate(today()),W-M,H-38,{sz:9,al:'r',c:rgb(.9,.97,.97)});
  y=H-100;
  const info=[];if(f.nome)info.push(['Nome',f.nome]);
  info.push(['Entidade',f.ent?ent(f.ent).nome:[...new Set(list.map(r=>ent(r.ent).nome))].join(', ')]);
  if(f.tarefa)info.push(['Tarefa',f.tarefa==='__sem'?'(sem tarefa)':f.tarefa]);
  info.forEach(([k,v])=>{txt(k+':',M,y,{b:1,sz:10});txt(v,M+60,y,{sz:10,w:W-2*M-60});y-=15});
  y-=6;
  // Totais
  const tH=list.reduce((a,r)=>a+regHoras(r),0),tB=list.reduce((a,r)=>a+regBase(r),0),tA=f.adics?list.reduce((a,r)=>a+adicTot(r),0):0,nD=new Set(list.map(r=>r.data)).size;
  const boxes=[['Horas trabalhadas',hh(tH)]].concat(V?[['Valor das horas',eurP(tB)]].concat(f.adics&&tA?[['Adicionais',eurP(tA)]]:[]).concat([['Total',eurP(tB+tA)]]):[]);
  const bw=(W-2*M-(boxes.length-1)*8)/boxes.length;
  boxes.forEach((b,i)=>{const x=M+i*(bw+8);pg.drawRectangle({x,y:y-40,width:bw,height:44,color:SH});txt(b[0],x+8,y-12,{sz:8,c:GR,w:bw-16});txt(b[1],x+8,y-30,{b:1,sz:12,w:bw-16,c:i===boxes.length-1&&V?ACC:BK})});
  y-=62;
  // Colunas (por dia)
  const cols=[{h:'Data',w:62},{h:'Dia',w:28},{h:'Horário',w:70},{h:'Pausa',w:36,al:'r'},{h:'Horas',w:40,al:'r'},{h:'Tarefa',w:0}].concat(V?[{h:'€/h',w:42,al:'r'},{h:'Valor',w:58,al:'r'}]:[]);
  const fixo=cols.reduce((a,c)=>a+c.w,0);cols.find(c=>c.h==='Tarefa').w=W-2*M-fixo;
  let cx=M;cols.forEach(c=>{c.x=cx;cx+=c.w});
  const cab=(cs)=>{pg.drawRectangle({x:M,y:y-5,width:W-2*M,height:17,color:ACC});cs.forEach(c=>txt(c.h,c.al==='r'?c.x+c.w-4:c.x+4,y,{b:1,sz:8.5,c:rgb(1,1,1),al:c.al}));y-=18};
  const precisa=(h,cs)=>{if(y-h<M+20){novaPag();if(cs)cab(cs)}};
  const linhaReg=(r,cs,semTarefa)=>{
    const vals={Data:fdate(r.data),Dia:dow(r.data),'Horário':r.modo==='horas'?'—':r.ini+' - '+r.fim,Pausa:r.modo==='horas'||!+r.pausa?'':r.pausa+' min',Horas:hh(regHoras(r)),Tarefa:semTarefa?'':(r.tarefa||'')+(multiEnt?(r.tarefa?' · ':'')+ent(r.ent).nome:''),'€/h':eurP(r.valor).replace(' €',''),Valor:eurP(regBase(r))};
    precisa(14,cs);cs.forEach(c=>txt(vals[c.h]||'',c.al==='r'?c.x+c.w-4:c.x+4,y,{sz:8.5,al:c.al,w:c.w-8}));y-=4;
    if(f.notas&&r.nota){y-=9;precisa(10,cs);txt('Nota: '+r.nota,cols[2].x+4,y,{sz:7.5,c:GR,w:W-M-cols[2].x-8});y-=4}
    if(f.adics)adicsOf(r).forEach(a=>{y-=10;precisa(10,cs);txt('+ '+(a.desc||'Adicional'),cols[2].x+4,y,{sz:8,c:GR,w:(V?cs[cs.length-1].x:W-M)-cols[2].x-12});if(V)txt(eurP(+a.valor||0),W-M-4,y,{sz:8,c:GR,al:'r'})});
    y-=6;linha(y+2);y-=9};
  const subtotal=(rot,hs,val,cs)=>{precisa(16);pg.drawRectangle({x:M,y:y-5,width:W-2*M,height:16,color:SH});txt(rot,M+4,y,{b:1,sz:8.5});const hc=(cs||cols).find(c=>c.h==='Horas');txt(hh(hs),hc.x+hc.w-4,y,{b:1,sz:8.5,al:'r'});if(V)txt(eurP(val),W-M-4,y,{b:1,sz:8.5,al:'r'});y-=22};
  if(f.grupo==='dia'){
    y-=4;txt('Registos por dia',M,y,{b:1,sz:11,c:ACC});y-=18;cab(cols);
    list.forEach(r=>linhaReg(r,cols));
    subtotal('Total',tH,tB+tA);
  }else{
    const grupos={};list.forEach(r=>{const k=r.tarefa||'(sem tarefa)';(grupos[k]=grupos[k]||[]).push(r)});
    const keys=Object.keys(grupos).sort((a,b)=>a==='(sem tarefa)'?1:b==='(sem tarefa)'?-1:a.localeCompare(b,'pt'));
    // Resumo por tarefa
    y-=4;txt('Resumo por tarefa',M,y,{b:1,sz:11,c:ACC});y-=18;
    const rc=[{h:'Tarefa',w:0},{h:'Horas',w:70,al:'r'}].concat(V?[{h:'Valor',w:80,al:'r'}]:[]);
    rc[0].w=W-2*M-rc.slice(1).reduce((a,c)=>a+c.w,0);let rx=M;rc.forEach(c=>{c.x=rx;rx+=c.w});
    cab(rc);
    keys.forEach(k=>{const g=grupos[k];const v={Tarefa:k,Horas:hh(g.reduce((a,r)=>a+regHoras(r),0)),Valor:eurP(g.reduce((a,r)=>a+regBase(r)+(f.adics?adicTot(r):0),0))};
      precisa(14,rc);rc.forEach(c=>txt(v[c.h],c.al==='r'?c.x+c.w-4:c.x+4,y,{sz:9,al:c.al,w:c.w-8}));y-=6;linha(y+2);y-=9});
    subtotal('Total',tH,tB+tA,rc);
    // Detalhe por tarefa
    const cs2=cols.filter(c=>c.h!=='Tarefa');const extra=cols.find(c=>c.h==='Tarefa').w;
    let x2=M;cs2.forEach(c=>{if(c.h==='Horário')c.w+=extra;c.x=x2;x2+=c.w});
    keys.forEach(k=>{const g=grupos[k];precisa(60);y-=6;txt(k,M,y,{b:1,sz:11,c:ACC,w:W-2*M});y-=18;cab(cs2);
      g.forEach(r=>linhaReg(r,cs2,true));
      subtotal('Subtotal — '+k,g.reduce((a,r)=>a+regHoras(r),0),g.reduce((a,r)=>a+regBase(r)+(f.adics?adicTot(r):0),0))});
    cs2.forEach(c=>{if(c.h==='Horário')c.w-=extra});
  }
  // Rodapé
  doc.getPages().forEach((p,i)=>{p.drawText(safe('Página '+(i+1)+' de '+nPag),{x:W-M-F.widthOfTextAtSize('Página '+(i+1)+' de '+nPag,7.5),y:22,size:7.5,font:F,color:GR});if(f.nome)p.drawText(safe(f.nome+' · '+perTxt),{x:M,y:22,size:7.5,font:F,color:GR})});
  return await doc.save();
}

// Cópias de segurança
async function doExport(enc){
  try{const nome='horas-backup-'+today()+(enc?'-protegida':'')+'.json';
    const obj=enc?Object.assign(await encObj(S,KEY,SALT,PINLEN),{exportado:new Date().toISOString()}):Object.assign({},S,{exportado:new Date().toISOString()});
    const ok=await download(nome,JSON.stringify(obj,null,enc?0:1),'application/json');
    if(ok){S.cfg.ultBackup=today();save()}}catch(e){toast('Não foi possível exportar')}
}
function importFile(f){const rd=new FileReader();rd.onload=()=>{let d;try{d=JSON.parse(rd.result)}catch(x){toast('Ficheiro inválido');return}
  const aplicar=data=>{if(!data||!data.regs||!data.ents){toast('Ficheiro inválido');return}
    confirmM(`Importar esta cópia (${data.regs.length} registos, ${(data.pags||[]).length} pagamentos)? Os dados atuais serão substituídos.`,()=>{const ub=S.cfg.ultBackup;S=norm(data);delete S.exportado;if(ub&&!(S.cfg.ultBackup>ub))S.cfg.ultBackup=ub;save('Cópia importada')})};
  if(d&&d.enc){openM(`<h3>Cópia protegida</h3><p class="muted">Esta cópia está encriptada. Introduza o PIN que estava ativo quando foi feita.</p><div class="row"><div><label>PIN da cópia</label><input type="password" inputmode="numeric" id="ipin" autocomplete="off"></div></div><div class="btns"><button class="btn" id="iok">Abrir</button><button class="btn sec" id="ican">Cancelar</button></div>`);
    $('#ipin').focus();$('#ican').onclick=closeM;
    $('#iok').onclick=async()=>{try{const k=await deriveKey($('#ipin').value,d.salt);const data=await decObj(d,k);closeM();aplicar(data)}catch(e){toast('PIN errado');$('#ipin').value=''}}}
  else aplicar(d)};rd.readAsText(f)}

// PIN
function pinModal(modo){
  const precisaAtual=modo!=='ativar',precisaNovo=modo!=='desativar';
  openM(`<h3>${{ativar:'Ativar PIN',alterar:'Alterar PIN',desativar:'Desativar PIN'}[modo]}</h3>
  ${precisaAtual?'<div class="row"><div><label>PIN atual</label><input type="password" inputmode="numeric" id="pa" autocomplete="off"></div></div>':''}
  ${precisaNovo?'<div class="row r2"><div><label>Novo PIN (4 a 8 dígitos)</label><input type="password" inputmode="numeric" id="pn1" autocomplete="off"></div><div><label>Repetir PIN</label><input type="password" inputmode="numeric" id="pn2" autocomplete="off"></div></div><p class="muted">Se esquecer o PIN não há forma de recuperar os dados — só a partir de uma cópia de segurança.</p>':''}
  <div class="btns"><button class="btn" id="pok">Confirmar</button><button class="btn sec" id="pcan">Cancelar</button></div>`);
  $('#pcan').onclick=closeM;
  $('#pok').onclick=async()=>{
    if(precisaAtual){await saveChain;try{const w=JSON.parse(localStorage.getItem(LK));const k=await deriveKey($('#pa').value,w.salt);await decObj(w,k)}catch(e){toast('PIN atual errado');return}}
    if(precisaNovo){const a=$('#pn1').value,b=$('#pn2').value;if(!/^\d{4,8}$/.test(a)){toast('O PIN deve ter 4 a 8 dígitos');return}if(a!==b){toast('Os PIN não coincidem');return}
      SALT=newSalt();KEY=await deriveKey(a,SALT);PINLEN=a.length}
    else{KEY=null;SALT=null;PINLEN=0}
    closeM();await persist();shell();render();toast(modo==='desativar'?'PIN desativado':'PIN guardado')};
}
function lockNow(){if(!KEY)return;persist().then(()=>{S=null;KEY=null;lockScreen()})}
let pinBuf='',fails=0,blockUntil=0;
function lockScreen(){
  let w=null;try{w=JSON.parse(localStorage.getItem(LK))}catch(e){}
  if(!w||!w.enc){S=norm(w);shell();render();return}
  const len=w.len||4;pinBuf='';
  document.getElementById('app').innerHTML=`<div class="lock"><div class="lk-ic">🔒</div><h2>Registo de Horas</h2><p id="lkm">Introduza o PIN</p><div class="dots" id="dots">${'<i></i>'.repeat(len)}</div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-k="${k}">${k}</button>`).join('')}</div><button class="lnk" id="esq">Esqueci-me do PIN</button></div>`;
  const dots=()=>document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('f',i<pinBuf.length));
  const msg=t=>{$('#lkm').textContent=t};
  const tentar=async()=>{
    if(Date.now()<blockUntil){msg('Aguarde '+Math.ceil((blockUntil-Date.now())/1000)+' s');pinBuf='';dots();return}
    msg('A verificar…');
    try{const k=await deriveKey(pinBuf,w.salt);const d=await decObj(w,k);KEY=k;SALT=w.salt;PINLEN=len;S=norm(d);fails=0;shell();render()}
    catch(e){fails++;pinBuf='';dots();const el=$('#dots');el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');
      if(fails>=5){blockUntil=Date.now()+30000*Math.pow(2,fails-5);msg('Demasiadas tentativas — aguarde '+Math.round((blockUntil-Date.now())/1000)+' s')}else msg('PIN errado')}};
  document.querySelectorAll('.pad [data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;
    if(k==='⌫')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<len)pinBuf+=k;dots();if(pinBuf.length===len)tentar()});
  document.onkeydown=e=>{if(!$('.lock'))return;if(/^\d$/.test(e.key)&&pinBuf.length<len){pinBuf+=e.key;dots();if(pinBuf.length===len)tentar()}else if(e.key==='Backspace'){pinBuf=pinBuf.slice(0,-1);dots()}};
  $('#esq').onclick=()=>{document.getElementById('app').innerHTML=`<div class="lock"><div class="lk-ic">⚠️</div><h2>Esqueceu-se do PIN?</h2><p style="max-width:320px;margin-top:8px">Por segurança, os dados só abrem com o PIN. A única solução é apagar os dados deste telemóvel e depois importar uma cópia de segurança.</p>
    <p style="margin-top:16px;font-size:13px">Para confirmar, escreva <b>APAGAR</b>:</p><input id="apg" style="max-width:220px;margin-top:8px;text-align:center" autocomplete="off"><button class="btn" id="apgok" style="margin-top:12px;background:#b42318;color:#fff">Apagar dados</button><button class="lnk" id="volt">Voltar</button></div>`;
    $('#volt').onclick=lockScreen;$('#apgok').onclick=()=>{if($('#apg').value.trim().toUpperCase()!=='APAGAR')return;try{localStorage.removeItem(LK)}catch(e){}KEY=null;SALT=null;PINLEN=0;S=norm(null);TAB='config';shell();render();toast('Dados apagados — pode importar uma cópia')}};
}
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(KEY&&hiddenAt&&Date.now()-hiddenAt>60000)lockNow()});

if(START_LOCKED)lockScreen();else{shell();render()}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
})();
</script>
